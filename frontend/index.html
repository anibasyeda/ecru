<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="author" content="Aniba Syeda" />

    <!-- Canonical URL. Update to your final Vercel domain after deploy. -->
    <link rel="canonical" href="https://ecru.vercel.app/" />

    <!-- Favicon: an inline SVG (a cream tile with a gold É), no file needed -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f6f5f2'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='40' fill='%23a1804a' text-anchor='middle'%3E%C3%89%3C/text%3E%3C/svg%3E"
    />

    <!-- Tab title + SEO description -->
    <title>ÉCRU · Minimal Skincare</title>
    <meta
      name="description"
      content="ÉCRU: a pared-back skincare ritual of five considered formulas. Clean, refillable, and quietly effective."
    />

    <!-- Open Graph: the preview card shown on LinkedIn, Facebook, Slack, etc.
         After deploy, swap og:image + twitter:image for an ABSOLUTE URL to a
         screenshot of your live site, and set og:url to your Vercel domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ÉCRU" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://ecru.vercel.app/" />
    <meta property="og:title" content="ÉCRU · Minimal Skincare" />
    <meta
      property="og:description"
      content="A pared-back skincare ritual of five considered formulas. Clean, refillable, quietly effective."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1614159102522-81c48758428f?w=1200&q=80&fit=crop"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ÉCRU minimal skincare — five considered formulas"
    />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ÉCRU · Minimal Skincare" />
    <meta
      name="twitter:description"
      content="A pared-back skincare ritual of five considered formulas."
    />
    <meta
      name="twitter:image"
      content="https://images.unsplash.com/photo-1614159102522-81c48758428f?w=1200&q=80&fit=crop"
    />
    <meta
      name="twitter:image:alt"
      content="ÉCRU minimal skincare — five considered formulas"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
